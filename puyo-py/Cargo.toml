[package]
name = "puyo-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_puyo"
crate-type = ["cdylib", "rlib"]

[dependencies]
puyo-core = { path = "../puyo-core" }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
numpy = "0.29"

[features]
extension-module = ["pyo3/extension-module"]
