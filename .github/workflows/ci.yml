name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --release
      - name: Build Python package
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/Scripts/activate ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          pip install maturin pytest
          maturin develop --release
          pytest -q

  windows-training-smoke:
    # setup_windows.ps1 と start_training.ps1 を実際の Windows で動かす(GPU なしなので CPU 版 torch)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: setup_windows.ps1
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\setup_windows.ps1 -SkipBench
      - name: start_training.ps1 (new run)
        shell: powershell
        run: >
          powershell -ExecutionPolicy Bypass -File scripts\start_training.ps1
          -RunName ci -TotalSteps 2048 -NEnvs 4 -CheckpointEvery 1024 -VideoEvery 1
          -Set "eval.seeds.count=3","eval.max_steps=30","video.seeds=[0]","video.max_moves=20","ppo.n_steps=128","ppo.batch_size=128"
      - name: start_training.ps1 (resume, subproc envs)
        shell: powershell
        run: >
          powershell -ExecutionPolicy Bypass -File scripts\start_training.ps1
          -RunName ci -TotalSteps 4096 -NEnvs 4 -VecEnv subproc -CheckpointEvery 1024 -VideoEvery 1
          -Set "eval.seeds.count=3","eval.max_steps=30","video.seeds=[0]","video.max_moves=20","ppo.n_steps=128","ppo.batch_size=128"
      - name: Check outputs
        shell: powershell
        run: |
          Get-ChildItem runs\ci\checkpoints, runs\ci\videos | Format-Table Name, Length
          $zips = @(Get-ChildItem runs\ci\checkpoints\step_*.zip)
          if ($zips.Count -lt 4) { throw "expected >= 4 checkpoints, got $($zips.Count)" }
          if (-not (Test-Path runs\ci\resume_history.jsonl)) { throw "resume was not recorded" }
          if (@(Get-ChildItem runs\ci\videos\step_*.mp4).Count -lt 1) { throw "no videos" }

  docker-training-smoke:
    # docker compose での学習(GPU なしのランナーなので CPU 版 torch・CPU 用の上書き設定)
    runs-on: ubuntu-latest
    env:
      TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.cpu.yml
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: $COMPOSE build train
      - name: check_env.sh (tests)
        run: $COMPOSE run --rm train bash scripts/check_env.sh --skip-bench
      - name: start_training.sh (new run)
        run: >
          $COMPOSE run --rm train bash scripts/start_training.sh --run-name ci --total-steps 2048
          --n-envs 4 --checkpoint-every 1024 --video-every 1
          --set eval.seeds.count=3 --set eval.max_steps=30 --set "video.seeds=[0]"
          --set video.max_moves=20 --set ppo.n_steps=128 --set ppo.batch_size=128
      - name: start_training.sh (resume)
        run: >
          $COMPOSE run --rm train bash scripts/start_training.sh --run-name ci --total-steps 4096
          --n-envs 4 --checkpoint-every 1024 --video-every 1
          --set eval.seeds.count=3 --set eval.max_steps=30 --set "video.seeds=[0]"
          --set video.max_moves=20 --set ppo.n_steps=128 --set ppo.batch_size=128
      - name: Check outputs
        run: |
          ls -la runs/ci/checkpoints runs/ci/videos
          test "$(ls runs/ci/checkpoints/step_*.zip | wc -l)" -ge 4
          test -f runs/ci/resume_history.jsonl
          ls runs/ci/videos/step_*.mp4
